# ═══════════════════════════════════════════════════════════════
#  .github/workflows/deploy.yml
#  GitHub Actions — Automatic Build & Deploy to GitHub Pages
#
#  WHAT THIS DOES:
#    Every time you push to the 'main' branch (including via
#    GitHub Desktop), this workflow automatically:
#      1. Installs Node.js and npm dependencies
#      2. Builds the React app with Vite (npm run build)
#      3. Publishes the dist/ folder to GitHub Pages
#
#  RESULT:
#    Your app is live at:
#    https://<your-username>.github.io/<your-repo-name>/
#
#  SETUP REQUIRED (one-time):
#    In your GitHub repo → Settings → Pages:
#    Set "Source" to "GitHub Actions"
# ═══════════════════════════════════════════════════════════════

name: Deploy PhishTriage to GitHub Pages

on:
  # Runs on every push to main (triggered by GitHub Desktop's "Push origin")
  push:
    branches:
      - main

  # Also allows manual trigger from the Actions tab on GitHub
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Build the React app ─────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        # Note: No API key needed here — users enter their own key
        # in the app UI at runtime. Nothing is baked into the build.

      - name: Upload build artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Job 2: Deploy to GitHub Pages ──────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
